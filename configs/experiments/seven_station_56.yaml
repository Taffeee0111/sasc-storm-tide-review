version: v1.0-seven-station-56
experiment_id: seven_station_56_closed_book

stations:
  all: ["8534720", "8632200", "8656483", "8670870", "8721604", "8638610", "8639348"]

events:
  all:
    - isabel_2003
    - irene_2011
    - sandy_2012
    - matthew_2016
    - florence_2018
    - dorian_2019
    - isaias_2020
    - nicole_2022
  expected_hours_per_event: 216

model:
  label_column: ntr_m
  reconstruct_water_level_with_predicted_tide: true
  lookback_hours: 24
  hidden_size: 64
  num_layers: 3
  bidirectional: true
  dropout: 0.2
  batch_size: 128
  learning_rate: 0.001
  max_epochs: 50
  early_stopping_patience: 5
  random_seeds: [20260723, 20260724, 20260725]

features:
  dynamic:
    - predicted_tide_m
    - u10
    - v10
    - t2m
    - msl
    - tp
    - sst
    - swh
    - mwp
    - mwd_sin
    - mwd_cos
  forbidden_target: [water_level_m, ntr_m]

similarity:
  groups:
    atmosphere: [u10, v10, t2m, msl, tp]
    wave: [sst, swh, mwp, mwd_sin, mwd_cos]
    coastal:
      - coastline_orientation_sin2
      - coastline_orientation_cos2
      - nearshore_log_depth
      - shelf_slope_m_per_km
      - open_ray_fraction_50km
  include_geographic_distance: false
  grid_step: 0.1
  temperatures: [0.25, 0.5, 1.0, 2.0]

data:
  event_dataset: data/processed/preexperiment/event_dataset.csv
  coastal_context: data/processed/coastal_context/coastal_static_features.csv

data_policy:
  allow_new_downloads: false
  preserve_historical_assets: true
  target_labels_evaluation_only: true
